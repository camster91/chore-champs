version: '3.8'

services:
  app:
    image: chore-champs:latest
    container_name: kids-chore-app
    restart: always
    ports:
      - "3055:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    networks:
      - proxy
    depends_on:
      - kids-chore-postgres

  kids-chore-postgres:
    image: postgres:15-alpine
    container_name: kids-chore-postgres
    restart: always
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  postgres_data:
