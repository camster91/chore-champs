name: Temporary approved archive batch runner

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  archive-approved-repositories:
    if: >-
      github.event.pull_request.title == '[temporary] Execute approved repository archive batch 2026-08-17'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Run approved archival with GitHub CLI
        env:
          SYSTEM_TOKEN: ${{ github.token }}
          HOST_REPOSITORY: camster91/chore-champs
          HOST_DEFAULT_BRANCH: master
          WORKFLOW_PATH: .github/workflows/temporary-approved-archive-batch-pr-20260817.yml
          OLD_WORKFLOW_PATH: .github/workflows/temporary-approved-archive-batch-20260817.yml
          TRIGGER_BRANCH: ops/approved-archive-batch-20260817
          TRIGGER_NONCE: 94471ba9-61fe-4e02-8f6b-891810a86a44
          GH_OAUTH_CLIENT_ID: 178c6fc778ccc68e1d6a
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          pr_body="$(jq -r '.pull_request.body // ""' "${GITHUB_EVENT_PATH}")"
          head_ref="$(jq -r '.pull_request.head.ref // ""' "${GITHUB_EVENT_PATH}")"
          if [[ "${pr_body}" != *"${TRIGGER_NONCE}"* || "${head_ref}" != "${TRIGGER_BRANCH}" ]]; then
            echo 'Trigger branch or nonce did not match; exiting without changes.'
            exit 0
          fi

          remove_file_with_token() {
            local token="$1" path="$2" sha
            sha="$(GH_TOKEN="${token}" gh api \
              "repos/${HOST_REPOSITORY}/contents/${path}?ref=${HOST_DEFAULT_BRANCH}" \
              --jq '.sha' 2>/dev/null || true)"
            if [[ -n "${sha}" ]]; then
              GH_TOKEN="${token}" gh api --method DELETE \
                "repos/${HOST_REPOSITORY}/contents/${path}" \
                -f message='chore: remove temporary archive workflow' \
                -f sha="${sha}" -f branch="${HOST_DEFAULT_BRANCH}" >/dev/null 2>&1 || true
            fi
          }

          cleanup_with_system_token() {
            local reason="$1"
            GH_TOKEN="${SYSTEM_TOKEN}" gh pr close "${PR_NUMBER}" \
              --repo "${HOST_REPOSITORY}" --comment "${reason}" >/dev/null 2>&1 || true
            GH_TOKEN="${SYSTEM_TOKEN}" gh api --method DELETE \
              "repos/${HOST_REPOSITORY}/git/refs/heads/${TRIGGER_BRANCH}" >/dev/null 2>&1 || true
            remove_file_with_token "${SYSTEM_TOKEN}" "${OLD_WORKFLOW_PATH}"
            remove_file_with_token "${SYSTEM_TOKEN}" "${WORKFLOW_PATH}"
          }

          response="$(curl --fail-with-body --silent --show-error \
            --request POST --header 'Accept: application/json' \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=${GH_OAUTH_CLIENT_ID}" \
            --data-urlencode 'scope=repo' https://github.com/login/device/code)"

          device_code="$(jq -er '.device_code' <<<"${response}")"
          user_code="$(jq -er '.user_code' <<<"${response}")"
          verification_uri="$(jq -er '.verification_uri' <<<"${response}")"
          interval="$(jq -er '.interval' <<<"${response}")"
          expires_in="$(jq -er '.expires_in' <<<"${response}")"

          echo "DEVICE_AUTH_URL=${verification_uri}"
          echo "DEVICE_AUTH_CODE=${user_code}"

          authorization_body="$(cat <<EOF
          ## GitHub CLI authorization required

          1. Open **${verification_uri}**.
          2. Enter code **${user_code}**.
          3. Review and approve the standard GitHub CLI \`repo\` permission.

          This runs the repository archival approved on August 17, 2026 for \`family-planner\`, \`lifestreak\`, \`chore-champs\`, \`meal-planner\`, and \`budget-app\`. It does not alter deployments, domains, databases, or production data. The OAuth token is masked and never committed or printed.
          EOF
          )"

          GH_TOKEN="${SYSTEM_TOKEN}" gh pr edit "${PR_NUMBER}" \
            --repo "${HOST_REPOSITORY}" --body "${authorization_body}" >/dev/null || true

          token=''
          deadline=$((SECONDS + expires_in))
          poll_interval="${interval}"
          while (( SECONDS < deadline )); do
            sleep "${poll_interval}"
            token_response="$(curl --silent --show-error --request POST \
              --header 'Accept: application/json' \
              --header 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "client_id=${GH_OAUTH_CLIENT_ID}" \
              --data-urlencode "device_code=${device_code}" \
              --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:device_code' \
              https://github.com/login/oauth/access_token)"
            token="$(jq -r '.access_token // empty' <<<"${token_response}")"
            [[ -n "${token}" ]] && break
            error_code="$(jq -r '.error // empty' <<<"${token_response}")"
            case "${error_code}" in
              authorization_pending) ;;
              slow_down) poll_interval=$((poll_interval + 5)) ;;
              access_denied)
                cleanup_with_system_token 'Authorization was denied. No repositories were archived; temporary assets were removed.'
                exit 1 ;;
              expired_token)
                cleanup_with_system_token 'Authorization expired. No repositories were archived; temporary assets were removed.'
                exit 1 ;;
              *)
                cleanup_with_system_token 'Authorization failed unexpectedly. No repositories were archived; temporary assets were removed.'
                exit 1 ;;
            esac
          done

          if [[ -z "${token}" ]]; then
            cleanup_with_system_token 'Authorization window ended. No repositories were archived; temporary assets were removed.'
            exit 1
          fi

          echo "::add-mask::${token}"
          export GH_TOKEN="${token}"
          [[ "$(gh api user --jq '.login')" == 'camster91' ]]

          archive_and_verify() {
            local repository="$1"
            [[ "$(gh api "repos/${repository}" --jq '.permissions.admin')" == 'true' ]]
            [[ "$(gh api "repos/${repository}" --jq '.archived')" == 'true' ]] || \
              gh api --method PATCH "repos/${repository}" -F archived=true >/dev/null
            [[ "$(gh api "repos/${repository}" --jq '.archived')" == 'true' ]]
            echo "ARCHIVED ${repository}"
          }

          gh api --method DELETE \
            'repos/camster91/family-planner/git/refs/heads/ops/archive-life-repos-20260817' >/dev/null 2>&1 || true

          archive_and_verify 'camster91/family-planner'
          archive_and_verify 'camster91/lifestreak'
          archive_and_verify 'camster91/meal-planner'
          archive_and_verify 'camster91/budget-app'

          gh pr close "${PR_NUMBER}" --repo "${HOST_REPOSITORY}" \
            --comment 'Four dependent repositories were archived and verified. Temporary ChoreChamps assets are being removed before ChoreChamps is archived last.' >/dev/null
          gh api --method DELETE "repos/${HOST_REPOSITORY}/git/refs/heads/${TRIGGER_BRANCH}" >/dev/null
          remove_file_with_token "${token}" "${OLD_WORKFLOW_PATH}"
          remove_file_with_token "${token}" "${WORKFLOW_PATH}"

          archive_and_verify 'camster91/chore-champs'
          echo 'ARCHIVE BATCH COMPLETE'