name: Production Health

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Check production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check HTTPS and application health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 \
            --write-out '\nhealth HTTP %{http_code}\n' \
            https://chores.ashbi.ca/api/health
          for path in / /login /signup /privacy-policy /robots.txt /sitemap.xml; do
            code=$(curl --fail --silent --show-error --location --max-time 20 \
              --output /dev/null --write-out '%{http_code}' "https://chores.ashbi.ca${path}")
            test "$code" = 200
            echo "$path HTTP $code"
          done
          curl --fail --silent --show-error --location --max-time 20 \
            --output /tmp/chorechamps-manifest.json \
            https://chores.ashbi.ca/manifest.json
          python3 - <<'PY'
          import json
          from urllib.request import urlopen

          with open('/tmp/chorechamps-manifest.json', encoding='utf-8') as handle:
              manifest = json.load(handle)
          assert manifest.get('name') == 'ChoreChamps'
          assert manifest.get('icons'), 'manifest has no icons'
          for icon in manifest['icons']:
              path = icon['src']
              assert path.startswith('/icons/'), path
              with urlopen(f'https://chores.ashbi.ca{path}', timeout=20) as response:
                  assert response.status == 200, (path, response.status)
              print(f'{path} HTTP 200')
          PY
